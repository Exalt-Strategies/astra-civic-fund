<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://api.fontshare.com/v2/css?f[]=sentient@500,501,600&f[]=satoshi@500,700&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{display:grid;grid-template-columns:720px 340px 140px;background:#F7F4EE;font-family:"Satoshi",sans-serif}
.copy{padding:62px 56px 56px 64px;display:flex;flex-direction:column}
.wm{font-family:"Sentient",serif;font-weight:600;font-size:34px;letter-spacing:.16em;color:#0B1331}
.wm span{color:#E47A2E}
.wm small{font-family:"Satoshi";font-size:13px;letter-spacing:.12em;color:#555A68;font-weight:700;margin-left:14px;vertical-align:middle}
h1{font-family:"Sentient",serif;font-weight:500;font-size:62px;line-height:1.04;letter-spacing:-.015em;color:#0B1331;margin-top:auto}
h1 em{color:#9C7A32}
.foot{margin-top:30px;padding-top:18px;border-top:1px solid #DDD5C4;display:flex;gap:26px;font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#555A68}
.foot span::before{content:"";display:inline-block;width:6px;height:6px;background:#E47A2E;transform:rotate(45deg);margin-right:10px;vertical-align:2px}
.photo{background:url(../photos/mi-capitol.jpg) center 34%/cover}
.rail{background:#E47A2E;display:grid;place-items:center}
.rail svg{width:64px;height:64px}
</style></head><body>
<div class="copy">
  <div class="wm"><span>A</span>STRA<small>CIVIC FUND</small></div>
  <h1>Building political power for the <em>next generation</em> of Indian Americans.</h1>
  <div class="foot"><span>Bipartisan</span><span>Midwest-rooted</span><span>astracivic.org</span></div>
</div>
<div class="photo"></div>
<div class="rail"><svg viewBox="0 0 64 64"><path d="M32 6l5.6 20.4L58 32l-20.4 5.6L32 58l-5.6-20.4L6 32l20.4-5.6Z" fill="#0B1331"/></svg></div>
</body></html>
