<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://api.fontshare.com/v2/css?f[]=sentient@400,401&f[]=satoshi@500,700&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{display:grid;grid-template-columns:720px 340px 140px;background:#F6F4EF;font-family:"Satoshi",sans-serif}
.copy{padding:58px 56px 56px 64px;display:flex;flex-direction:column}
.wm{display:flex;align-items:center;gap:16px}
.wm img{width:150px}
.wm small{font-size:13px;letter-spacing:.08em;color:#52595C;font-weight:700;text-transform:uppercase}
h1{font-family:"Sentient",serif;font-weight:400;font-size:62px;line-height:1.04;letter-spacing:-.015em;color:#0B1F24;margin-top:auto}
h1 em{color:#195561}
.foot{margin-top:30px;padding-top:18px;border-top:1px solid #DCD6C9;font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#52595C}
.photo{background:url(../photos/mi-capitol.jpg) center 34%/cover}
.rail{background:#195561;display:grid;place-items:center}
.rail img{width:70px}
</style></head><body>
<div class="copy">
  <div class="wm"><img src="../brand/astra-wordmark.svg" alt=""><small>Civic Fund</small></div>
  <h1>Building political power for the <em>next generation</em> of Indian Americans.</h1>
  <div class="foot">A political home for Indian Americans · astracivic.org</div>
</div>
<div class="photo"></div>
<div class="rail"><img src="../brand/astra-mark-white.svg" alt=""></div>
</body></html>
